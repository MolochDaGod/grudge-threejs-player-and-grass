<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grudge Studio · Character Creator</title>
  <meta name="theme-color" content="#1a120c" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon-mask.svg" color="#c9950a" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <script type="module" crossorigin src="/assets/landing-BtGBnZQr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/catalog-qIR7n6O_.js">
  <link rel="modulepreload" crossorigin href="/assets/three.module-DK_4hUQZ.js">
  <link rel="modulepreload" crossorigin href="/assets/GLTFLoader-XnLzW9AJ.js">
  <link rel="stylesheet" crossorigin href="/assets/landing-DATWtesp.css">
</head>

<body>
  <div id="creator-shell">
    <!-- Left rail: race / class / skin / animation pickers (Phase 2.2) -->
    <aside id="creator-left" class="creator-rail">
      <header class="creator-title">Grudge · Creator</header>
      <section class="creator-section" data-section="race">
        <h3>Race</h3>
        <div id="race-tiles" class="picker-grid"></div>
      </section>
      <section class="creator-section" data-section="skin">
        <h3>Skin</h3>
        <div id="skin-buttons" class="picker-row"></div>
      </section>
      <section class="creator-section" data-section="class">
        <h3>Class</h3>
        <div id="class-buttons" class="picker-row"></div>
      </section>
      <section class="creator-section" data-section="anim">
        <h3>Animation Pack</h3>
        <div id="anim-buttons" class="picker-row"></div>
      </section>
      <footer class="creator-footer">
        <a id="play-link" class="btn-primary" href="/play">Play in Grass Scene →</a>
      </footer>
    </aside>

    <!-- Center: 3D character preview (Phase 2.2) -->
    <main id="creator-stage">
      <canvas id="creator-canvas"></canvas>
      <div id="creator-hud">
        <div id="creator-name">Loading…</div>
        <div id="creator-status"></div>
      </div>
    </main>

    <!-- Right rail: mainpanel iframe (drives equipment via postMessage) -->
    <aside id="creator-right">
      <iframe
        id="mainpanel-iframe"
        title="Mainpanel"
        src="/mainpanel?creator=1"
        loading="eager"
      ></iframe>
    </aside>
  </div>

</body>

</html>
